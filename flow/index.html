<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Flow Field</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #050814;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      let width = window.innerWidth;
      let height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      const GRID_SIZE = 26; // 格子の間隔
      const LINE_LENGTH = 22; // ラインの長さ
      let time = 0;

      function drawFlowField() {
        // 残像っぽい背景
        ctx.fillStyle = 'rgba(5, 8, 20, 0.2)';
        ctx.fillRect(0, 0, width, height);

        ctx.lineWidth = 1;
        ctx.lineCap = 'round';

        for (let y = 0; y < height; y += GRID_SIZE) {
          for (let x = 0; x < width; x += GRID_SIZE) {
            // x, y と time から「向き」を決める
            const angle =
              Math.sin(x * 0.015 + time * 0.6) +
              Math.cos(y * 0.02 + time * 0.4);

            const dx = Math.cos(angle) * LINE_LENGTH;
            const dy = Math.sin(angle) * LINE_LENGTH;

            // 中心からちょっとだけ色を変える
            const t = (x / width + y / height) * 0.5;
            const r = 120 + t * 80;
            const g = 190 + t * 40;
            const b = 255;

            ctx.strokeStyle = `rgba(${r},${g},${b},0.85)`;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + dy);
            ctx.stroke();
          }
        }

        time += 0.02;
        requestAnimationFrame(drawFlowField);
      }

      drawFlowField();

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      });
    </script>
  </body>
</html>
